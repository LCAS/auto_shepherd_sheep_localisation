session: detector
init_cmd: |
  echo " "
  echo " "
  echo " "
  echo "Running Initialisation"

  #exec /bin/bash
  cd @TMULE_CONFIG_DIR@ || true
  set -o pipefail

  # Source the .bashrc
  source ~/.bashrc

  # Setup ROS2 DDS Settings
  export ROS_DOMAIN_ID=70
  unset ROS_LOCALHOST_ONLY

  # TODO: add this as a wget
  #https://lcas.lincoln.ac.uk/nextcloud/index.php/s/fCtzXNM74PktaGg
  PKG="/home/ros/base_ws/src/auto_shepherd_sheep_localisation_ros2"
  DP="$PKG/auto_shepherd_sheep_localisation_ros2/detection_process"

  export VIDEO_PATH="$DP/models/samples/sample_clip/video.mp4"
  export VDEO_SRT_PATH="$DP/models/samples/sample_clip/video.srt"

  export YOLO_WEIGHTS="$DP/models/samples/sample_model/Aerial-Auth-Asfenah-DeepBack-PrabsUoL3-9.pt"
  export YOLO_TRACKER="$DP/modules/bytetrack.yaml"

windows:

  - name: outputs
    panes:
      - rviz2
      - ros2 run auto_shepherd_sheep_localisation_ros2 map_visualiser_node.py

  - name: system
    panes:
      - ros2 run auto_shepherd_sheep_localisation_ros2 detect_sheep.py

  - name: inputs
    panes:
      - ros2 run auto_shepherd_sheep_localisation_ros2 data_loader_node.py --ros-args -p loop_video:=true -p video_path:=$VIDEO_PATH -p srt_path:=$VDEO_SRT_PATH
