[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sheepgeo"
version = "0.1.0"
description = "Sheep detection and geo-localization from drone videos"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "LCAS Auto Shepherd Team"}
]
keywords = ["sheep", "detection", "geolocation", "drone", "YOLO", "DJI"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "ultralytics>=8.0.0",
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "pyproj>=3.5.0",
    "pysrt>=1.1.2",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
sheepgeo = "sheepgeo.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sheepgeo*"]
exclude = ["tests*", "auto_shepherd_sheep_localisation_ros2*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
